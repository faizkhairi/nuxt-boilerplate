version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Majors held back on purpose. Drop an entry once its blocker clears.
    ignore:
      # typescript-eslint peers typescript <6.1.0
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the Node LTS the template targets (24), not Node Current
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @sidebase/nuxt-auth 1.x is built on next-auth v4 (v5 is still beta)
      - dependency-name: next-auth
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
