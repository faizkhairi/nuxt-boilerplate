packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  bcrypt: true
  esbuild: true
  vue-demi: true
  unrs-resolver: true

overrides:
  # GHSA-fx2h-pf6j-xcff: vite <=6.4.2 allows server.fs.deny bypass on
  # Windows. Scoped to vitepress's own vite (docs app dev server only);
  # Nuxt brings its own vite 8.
  vitepress>vite: ^6.4.3
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 stack exhaustion on recursive
  # object graphs, pulled in transitively by Prisma's config loader.
  deepmerge-ts: ^8.0.0
  # GHSA-3f6p-5ww8-9rcr: mysql2 <3.22.0 leaks credentials via an auth
  # plugin downgrade. Pulled in by Prisma's CLI even though this project
  # uses the Postgres adapter.
  mysql2: ^3.22.0

# @sidebase/nuxt-auth 1.4.0 imports `next-auth/core`, which next-auth stopped
# exporting after 4.21. Staying on 4.21 ships a critical advisory
# (GHSA-7rqj-j65f-68wh, fixed in 4.24.15), so the patch only re-exposes the
# `core` folder that 4.24.15 still ships. Drop it once sidebase supports 4.24.
patchedDependencies:
  next-auth: patches/next-auth.patch
